[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "20"

# Proxy dynamic SEO files from main domain to API Worker
[[redirects]]
from = "/sitemap.xml"
to = "https://api.lwsnb.dpdns.org/sitemap.xml"
status = 200

[[redirects]]
from = "/rss.xml"
to = "https://api.lwsnb.dpdns.org/rss.xml"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/manifest.webmanifest"

[headers.values]
Content-Type = "application/manifest+json"
