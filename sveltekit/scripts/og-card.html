<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;position:relative;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:#f7f9fe;display:flex;flex-direction:column;justify-content:center;padding:0 90px}
  /* 右上/左下装饰（Butterfly 主色） */
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}
  .b1{width:420px;height:420px;background:#49b1f5;top:-150px;right:-110px}
  .b2{width:330px;height:330px;background:#00c4b6;bottom:-130px;left:-90px;opacity:.35}
  .accent{position:absolute;left:0;top:0;width:12px;height:100%;background:linear-gradient(180deg,#49b1f5,#00c4b6)}
  .wrap{position:relative;z-index:2}
  .brand{display:flex;align-items:center;gap:20px;margin-bottom:34px}
  .logo{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,#49b1f5,#2a70a5);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:700;
    box-shadow:0 10px 26px rgba(73,177,245,.38)}
  .name{font-size:40px;font-weight:700;color:#1f2d3d;letter-spacing:1px}
  .title{font-size:66px;font-weight:800;color:#1f2d3d;line-height:1.22;letter-spacing:1px}
  .title .hl{color:#49b1f5}
  .sub{margin-top:26px;font-size:29px;color:#4c4948;line-height:1.55}
  .meta{margin-top:40px;display:flex;gap:14px;flex-wrap:wrap}
  .pill{font-size:22px;color:#49b1f5;background:rgba(73,177,245,.12);
    padding:8px 22px;border-radius:999px;font-weight:600}
  .url{position:absolute;right:90px;bottom:52px;font-size:26px;color:#858585;letter-spacing:.5px;z-index:2}
</style></head>
<body>
  <div class="accent"></div><div class="blob b1"></div><div class="blob b2"></div>
  <div class="wrap">
    <div class="brand">
      <div class="logo">L</div>
      <div class="name">Lwsnb</div>
    </div>
    <div class="title">折腾代码，<span class="hl">也记录生活</span></div>
    <div class="sub">前端开发 · Serverless · Cloudflare Workers<br>自托管博客与在线工具</div>
    <div class="meta">
      <span class="pill">SvelteKit</span>
      <span class="pill">Cloudflare</span>
      <span class="pill">Butterfly</span>
    </div>
  </div>
  <div class="url">lwsnb.eu.cc</div>
</body></html>
