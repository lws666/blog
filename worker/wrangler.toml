name = "blog-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Twikoo 后端依赖：nodejs_compat（jsdom/DOMPurify）与较新 compatibility_date
# （其代码使用 FinalizationRegistry，2025-03 日期下未启用 → code 1000）
# 实测提升到 2026-09-01 后博客现有功能无回归
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domains (must be declared here: `wrangler deploy` syncs custom
# domains to this list and would otherwise detach API-attached ones)
routes = [
  { pattern = "api.lwsnb.dpdns.org", custom_domain = true },
  { pattern = "api.lwsnb.eu.cc", custom_domain = true },
  { pattern = "img.lwsnb.eu.cc", custom_domain = true },
]

# ---- D1 Database ----
[[d1_databases]]
binding = "DB"
database_name = "blog"
database_id = "d894eec2-4dc8-473a-92ca-efe3c13261de"

# ---- Workers AI (article summaries) ----
[ai]
binding = "AI"

# ---- Environment Variables (set via wrangler secret) ----
# B2_ACCESS_KEY_ID
# B2_SECRET_ACCESS_KEY
# UPLOAD_TOKEN
# GITHUB_CLIENT_SECRET

[vars]
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
B2_REGION = "us-east-005"
B2_BUCKET = "Valaxy"
# GitHub OAuth app client id for admin login (public value)
GITHUB_CLIENT_ID = "Ov23liXqF7L1tfiBieVr"
