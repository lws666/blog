name = "lwsnb"
compatibility_date = "2026-07-22"
main = "src/index.js"

# Routes (zone_id required since custom_domain API is unavailable)
routes = [
  { pattern = "www.lwsnb.dpdns.org/*", zone_id = "7b56790c6ed08c291850e8ea182b2341" },
]

compatibility_flags = [ "nodejs_compat" ]

# Observability
[observability]
enabled = true

# Serve static assets from dist/
[assets]
directory = "dist"
binding = "ASSETS"
# By default Cloudflare's asset server answers before the Worker runs, so `/`
# was always served as dist/index.html and the crawler pre-render branch in
# src/index.js could never fire. Run the Worker first for the homepage only,
# leaving every other asset on the fast static path.
#
# /api/* is included so the browser can call the API same-origin: previously
# every fetch crossed to api.lwsnb.eu.cc (extra DNS + TLS handshake, plus
# another host that can be slow or blocked). The Worker now forwards those
# requests to blog-worker in-process via the service binding below.
run_worker_first = [ "/", "/api/*" ]

# In-process call into the API Worker — no public network round trip.
[[services]]
binding = "API"
service = "blog-worker"
