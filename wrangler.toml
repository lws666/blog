name = "lwsnb"
compatibility_date = "2026-07-22"
main = "src/index.js"

# Routes (zone_id required since custom_domain API is unavailable)
# 注意:这里列出的是 Worker 的全部 custom domains——wrangler deploy 会把
# 不在清单里的旧域名一并删除(www.lwsnb.eu.cc 曾因此被顶掉)。
routes = [
  { pattern = "www.lwsnb.dpdns.org/*", zone_id = "7b56790c6ed08c291850e8ea182b2341" },
  # www 主站由 Cloudflare Pages 提供（custom domain 在 Pages 项目上）。
  # 这里**只精确匹配百度验证文件这一个路径**，其余 www 请求仍走 Pages。
  # 原因：百度验证只请求 http:// 且不跟随 301，而 Pages 强制 HTTP→HTTPS，
  # 必须由 Worker 在边缘对这一个 URL 直接返回 200。
  # ⚠ 不要用 www.lwsnb.eu.cc/* —— 那会把 HTTPS 流量也劫持到 Worker，
  #   导致 Pages 被绕过、静态文件取不到（曾因此返回首页 HTML）。
  # ⚠ 只保留验证文件的精确路由。**不要**加 www.lwsnb.eu.cc/ 或 /*：
  #   那会把 HTTPS 主页也劫持到本 Worker（assets 是旧的 dist 副本），
  #   导致 www 返回过期内容、Pages 被绕过。
  { pattern = "www.lwsnb.eu.cc/baidu_verify_codeva-mQlXESBIa4.html", zone_id = "a6c4a9d9355e33800ed27c13e522f75b" },
  # 备用线路域名:301 到 www(在 src/index.js 的 REDIRECT_HOSTS 中)
  { pattern = "cf.lwsnb.eu.cc", custom_domain = true },
]

compatibility_flags = [ "nodejs_compat" ]

# Observability
[observability]
enabled = true

# Serve static assets from dist/
[assets]
directory = "dist"
binding = "ASSETS"
# By default Cloudflare's asset server answers before the Worker runs, so `/`
# was always served as dist/index.html and the crawler pre-render branch in
# src/index.js could never fire. Run the Worker first for the homepage only,
# leaving every other asset on the fast static path.
#
# /api/* is included so the browser can call the API same-origin: previously
# every fetch crossed to api.lwsnb.eu.cc (extra DNS + TLS handshake, plus
# another host that can be slow or blocked). The Worker now forwards those
# requests to blog-worker in-process via the service binding below.
#
# /llms.txt and /robots.txt are included because stale copies also sit in
# public/ (dist/), and the asset server was winning: the live llms.txt still
# named the retired www.lwsnb.dpdns.org and listed no articles, while the
# Worker's generated version stays in sync with the site and the post list.
run_worker_first = [ "/", "/api/*", "/llms.txt", "/robots.txt" ]

# In-process call into the API Worker — no public network round trip.
[[services]]
binding = "API"
service = "blog-worker"
